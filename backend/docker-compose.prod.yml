services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repolens-backend-prod
    restart: always
    env_file:
      - .env
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    ports:
      - "80:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repolens-celery-worker-prod
    restart: always
    env_file:
      - .env
    command: >
      sh -c "celery -A app.celery_app worker --loglevel=info --concurrency=4"
    depends_on:
      - api
